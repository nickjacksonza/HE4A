name: Deploy to GitHub Pages

# Builds the site from source and publishes it at https://healthequity4all.org
# on every push to main. The build writes CNAME into dist/, so the custom domain
# stays set across deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel any in-progress run if a newer push lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # --omit=dev: sharp and png-to-ico are only used by the one-off image
      # scripts in scripts/, not by build/build.js.
      - run: npm ci --omit=dev

      # Root build: no SITE_BASE_PATH, because the site is served from the
      # domain root.
      - run: npm run build

      - uses: actions/configure-pages@v5

      # Keep @v3: it includes dotfiles, so dist/.well-known/security.txt and
      # dist/.nojekyll are deployed. v4 and later leave hidden files out.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
